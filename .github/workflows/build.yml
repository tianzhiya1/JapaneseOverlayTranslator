name: Build Android APK
on: [workflow_dispatch, push]
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline Japanese speech model
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 30 "https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip" -o /tmp/ja.zip
          mkdir -p app/src/main/assets
          unzip -q /tmp/ja.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-ja-0.22 app/src/main/assets/model-ja
          test -f app/src/main/assets/model-ja/conf/model.conf
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JapaneseOverlayTranslator-v0.6-chinese-ocr-apk
          path: app/build/outputs/apk/debug/*.apk
