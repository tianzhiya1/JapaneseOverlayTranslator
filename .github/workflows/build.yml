name: Build Android APK
on: [workflow_dispatch, push]
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded queued runs in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          echo "Cleanup older queued Actions runs; current run is $GITHUB_RUN_ID"
          old_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=queued&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null || true)
          for old_id in $old_ids; do
            if [ "$old_id" != "$GITHUB_RUN_ID" ]; then
              echo "Cancelling queued workflow run $old_id"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/$old_id/cancel" >/dev/null 2>&1 || echo "Unable to cancel run $old_id"
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle offline Japanese speech model
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 30 "https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip" -o /tmp/ja.zip
          mkdir -p app/src/main/assets
          unzip -q /tmp/ja.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-ja-0.22 app/src/main/assets/model-ja
          test -f app/src/main/assets/model-ja/conf/model.conf
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JapaneseOverlayTranslator-v0.6-chinese-ocr-apk
          path: app/build/outputs/apk/debug/*.apk
