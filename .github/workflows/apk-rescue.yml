name: Build Android APK Rescue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apk-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    name: Build v0.6 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and bundle offline Japanese Vosk model
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 30 "https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip" -o /tmp/model-ja.zip
          mkdir -p app/src/main/assets
          unzip -q /tmp/model-ja.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-ja-0.22 app/src/main/assets/model-ja
          test -f app/src/main/assets/model-ja/conf/model.conf
      - name: Build Android APK
        run: gradle --no-daemon --console=plain assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JapaneseOverlayTranslator-v0.6-rescue-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
